{% extends "jira_integration/base.html" %}
{% load static %}

{% block title %}Доска спринта — Модуль Jira{% endblock %}

{% block content %}
<section
    id="jira-board"
    data-api-url="{% url 'jira_integration:api_board' %}"
    data-issue-url-template="{% url 'jira_integration:issue' key='ISSUEKEY' %}"
>
    <h1>Доска спринта</h1>

    <p id="board-message" role="status" aria-live="polite">
        Загружаем задачи…
    </p>

    <a
        id="board-login"
        href="{% url 'jira_integration:login' %}?next={{ request.path|urlencode }}"
        hidden
    >Войти снова</a>

    <button id="board-retry" class="jira-button" type="button" hidden>
        Повторить загрузку
    </button>

    <h2 id="board-sprint"></h2>
    <p id="board-updated"></p>
    <div id="board-columns" class="jira-board-columns"></div>

    <noscript>
        <p>Для загрузки доски включите JavaScript в браузере.</p>
    </noscript>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'jira_integration/js/board.js' %}" defer></script>
{% endblock %}
